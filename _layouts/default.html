<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1930">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="icon" href="{{ '/logo/Barba-CV-Icon-Site-V1_off_20260220.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Barba-CV home">
          <img src="{{ '/logo/Barba-CV-Icon-Site-V1_off_20260220.png' | relative_url }}" width="38" height="38" alt="">
          <span>Barba<span class="brand-accent">-CV</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/docs/getting-started/' | relative_url }}">Get started</a>
          <a href="{{ '/docs/field-reference/' | relative_url }}">Reference</a>
          <a href="{{ '/examples/' | relative_url }}">Examples</a>
          <a href="{{ '/docs/compatibility/' | relative_url }}">Versions</a>
          <a class="nav-github" href="https://github.com/Eurobotics-Association/barba-cv">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <div><strong>Barba-CV</strong><p>Open JSON data standard for interoperable CVs.</p></div>
        <div class="footer-links"><a href="{{ '/docs/' | relative_url }}">Documentation</a><a href="{{ '/history/' | relative_url }}">History</a><a href="{{ '/roadmap/' | relative_url }}">Roadmap</a><a href="https://github.com/Eurobotics-Association/barba-cv/blob/main/LICENSE">License</a></div>
      </div>
    </footer>
  </body>
</html>
