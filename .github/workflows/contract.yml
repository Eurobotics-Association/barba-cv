name: Contract checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/validate.py examples/barba-cv-1.3.example.json
      - run: python tools/validate.py examples/barba-cv-1.3.template.json
